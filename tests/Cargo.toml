[package]
name = "skia-rust-tests"
description = "1:1 ports of Skia's unit tests (tests/*.cpp), checked by `cargo xtask inventory verify`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
skia-rust-core.workspace = true
skia-rust-raster.workspace = true
skia-rust-effects.workspace = true
skia-rust-pathops.workspace = true
skia-rust-gpu.workspace = true
skia-rust-skcms.workspace = true
skia-rust-codec.workspace = true
skia-rust-libwebp.workspace = true
skia-rust-sksl = { workspace = true, features = ["wgsl"] }
skia-rust-tools.workspace = true
skia-rust-text.workspace = true
skia-rust-pdf.workspace = true
skia-rust-zlib.workspace = true
skia-rust-simd = { workspace = true, features = ["testing", "models"] }

[lints]
workspace = true
