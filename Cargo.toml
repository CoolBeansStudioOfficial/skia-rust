[workspace]
resolver = "3"
members = [
    "crates/skia-rust",
    "crates/skia-rust-simd",
    "crates/skia-rust-sksl",
    "crates/skia-rust-skcms",
    "crates/skia-rust-zlib",
    "crates/skia-rust-hb-subset",
    "crates/skia-rust-libpng",
    "crates/skia-rust-libwebp",
    "crates/skia-rust-wuffs",
    "crates/skia-rust-libjpeg",
    "crates/skia-rust-codec",
    "crates/skia-rust-core",
    "crates/skia-rust-raster",
    "crates/skia-rust-effects",
    "crates/skia-rust-pathops",
    "crates/skia-rust-text",
    "crates/skia-rust-svg",
    "crates/skia-rust-pdf",
    "benches",
    "crates/skia-rust-gpu",
    "tests",
    "tests/gm",
    "tests/tools",
    "oracle/rp-diff",
    "xtask",
]

[workspace.package]
version = "0.156.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/CoolBeansStudioOfficial/skia-rust"
authors = ["The skia-rust Authors"]

[workspace.dependencies]
skia-rust-simd = { path = "crates/skia-rust-simd", version = "0.156.0" }
skia-rust-skcms = { path = "crates/skia-rust-skcms", version = "0.156.0" }
skia-rust-zlib = { path = "crates/skia-rust-zlib", version = "0.156.0" }
skia-rust-hb-subset = { path = "crates/skia-rust-hb-subset", version = "0.156.0" }
skia-rust-libpng = { path = "crates/skia-rust-libpng", version = "0.156.0" }
skia-rust-wuffs = { path = "crates/skia-rust-wuffs", version = "0.156.0" }
skia-rust-libwebp = { path = "crates/skia-rust-libwebp", version = "0.156.0" }
skia-rust-libjpeg = { path = "crates/skia-rust-libjpeg", version = "0.156.0" }
skia-rust-codec = { path = "crates/skia-rust-codec", version = "0.156.0" }
skia-rust-sksl = { path = "crates/skia-rust-sksl", version = "0.156.0" }
skia-rust-core = { path = "crates/skia-rust-core", version = "0.156.0" }
skia-rust-raster = { path = "crates/skia-rust-raster", version = "0.156.0" }
skia-rust-effects = { path = "crates/skia-rust-effects", version = "0.156.0" }
skia-rust-pathops = { path = "crates/skia-rust-pathops", version = "0.156.0" }
skia-rust-text = { path = "crates/skia-rust-text", version = "0.156.0" }
skia-rust-svg = { path = "crates/skia-rust-svg", version = "0.156.0" }
skia-rust-pdf = { path = "crates/skia-rust-pdf", version = "0.156.0" }
skia-rust-tools = { path = "tests/tools", version = "0.156.0" }
skia-rust-gpu = { path = "crates/skia-rust-gpu", version = "0.156.0" }
bitflags = "2"
# wgpu backend of Graphite (docs/design/gpu.md §4.1, R7): pinned exactly, bumps are their own PRs.
# `default-features = false`: each target picks its backends in crates/skia-rust-gpu/Cargo.toml.
wgpu = { version = "=30.0.1", default-features = false }
# The WGSL validator of wgpu, for the generated-WGSL checks of skia-rust-gpu (dev-dependency only).
# Same version as the naga that wgpu 30.0.1 uses, so there is one copy.
naga = { version = "=30.0.1", default-features = false }
# Fontations backend: the exact versions Skia m156 pins (src/ports/fontations/Cargo.toml,
# MODULE.bazel.lock). skrifa 0.43.2 requires read-fonts ^0.40.1, so all three are pinned with `=`
# (docs/design/text.md §2.2). Bumped only with a Skia milestone bump.
skrifa = "=0.43.2"
read-fonts = "=0.40.1"
font-types = "=0.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `--cfg skia_rust_adapter_tests` runs the adapter-gated tests (`def_graphite_adapter_test!`, the
# GPU crate's pixel tests); the Linux x64 CI jobs set it (.github/workflows/ci.yml). Declared here
# because a member crate cannot add lints next to `lints.workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(skia_rust_adapter_tests)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
# Ported Skia arithmetic intentionally mirrors C++ casts and float comparisons.
# Allowed per-item with a comment, never workspace-wide.

# `cargo test` builds use the test profile. Level 1 keeps every debug check (debug assertions,
# overflow checks, which the debug CI jobs exist for) while cutting the unoptimized run time of
# the raster/GPU suites by an order of magnitude. Rust never contracts or reassociates float
# arithmetic at any opt level, so results are unchanged; exactness is still pinned by the
# release jobs (#34, #69).
[profile.test]
opt-level = 1

[profile.release]
debug = 1

[profile.bench]
debug = 1
