# Oracle builds. See docs/PLAN.md §5 and oracle/README.md.
#
# A *build* is one GN output directory of Skia with DM. A CPU *tier* is a build plus a
# runtime CPU cap (SKIA_ORACLE_CPU_CAP, added by oracle/patches/skia-oracle.patch).
# Goldens are generated and compared per tier.
#
# Skia picks x64 code paths in two places:
#   - compile time: SK_CPU_X64_LEVEL, from the baseline the whole library is built for;
#   - run time: SkOpts / Init_* functions switch to ssse3, ml3 (x86-64-v3) or ml4
#     (x86-64-v4) kernels when SkCpu::Supports() reports the CPU has them.
# xtask derives one tier per (build, runtime level) pair a shipped Skia can run: every
# runtime level from the build's own `level` upward. Tier names are `cpu-<build>` for the
# build's own level and `cpu-<build>-rt-<level>` above it.
#
# Baselines are raised with additive `-m` feature flags, never `/arch:`. GN appends
# extra_cflags after each target's own flags, so an `/arch:` here would override (lower)
# the `/arch:AVX2` / `/arch:AVX512` Skia compiles its ml3/ml4 kernels with.
#
# All builds use clang-cl, the compiler Chrome ships Skia with, so FMA contraction and
# other codegen choices match what real Skia users get.

[gn]
# Args shared by every build.
args = [
    "is_debug=false",
    "is_official_build=false",
    "skia_enable_tools=true",
    "skia_use_gl=false",
]
# Skia passes -ffp-contract=off for clang on every platform except Windows, where its
# /fp:precise makes clang-cl contract a*b+c into FMA in AVX2/AVX-512 code. Turn it off
# here too, so goldens match Skia as built everywhere else (and as Chrome builds it).
extra_cflags = ["/clang:-ffp-contract=off"]

# `level` is the runtime level the build's compile-time baseline already implies:
# baseline < ssse3 < ml3 < ml4.

[[build]]
name = "x64-sse2"
level = "baseline"

[[build]]
name = "x64-ssse3"
level = "ssse3"
extra_cflags = ["/clang:-mssse3"]

[[build]]
name = "x64-sse41"
level = "ssse3"
extra_cflags = ["/clang:-msse4.1"]

[[build]]
name = "x64-sse42"
level = "ssse3"
extra_cflags = ["/clang:-msse4.2"]

[[build]]
name = "x64-avx"
level = "ssse3"
extra_cflags = ["/clang:-mavx"]

[[build]]
name = "x64-v3"
level = "ml3"
extra_cflags = ["/clang:-mavx2", "/clang:-mbmi", "/clang:-mbmi2", "/clang:-mf16c", "/clang:-mfma"]

[[build]]
name = "x64-v4"
level = "ml4"
extra_cflags = ["/clang:-mavx2", "/clang:-mbmi", "/clang:-mbmi2", "/clang:-mf16c", "/clang:-mfma", "/clang:-mavx512f", "/clang:-mavx512dq", "/clang:-mavx512cd", "/clang:-mavx512bw", "/clang:-mavx512vl"]

# Scalar raster-pipeline proxy for wasm (design docs/design/raster-pipeline.md §4.5): Skia's
# `SkRasterPipeline_opts.h` honours a predefined SKRP_CPU_*, so this build runs the same
# scalar code (and lowp scalar pipeline) wasm32 gets, on x64. SkOpts kernels outside the raster
# pipeline stay SSE2. libm differs from Emscripten's musl, so a real wasm oracle still has the
# final word. Only its own tier is derived: runtime ml3/ml4 dispatch changes nothing here that a
# wasm host could do.
[[build]]
name = "x64-scalar"
level = "baseline"
single_tier = true
extra_cflags = ["/clang:-DSKRP_CPU_SCALAR"]

# RGBA variants (`SK_R32_SHIFT=0`, a define only). The goldens come from a Windows host, where
# N32 is BGRA; on macOS/Linux N32 is RGBA, so `8888` is only checkable there against goldens
# rendered with RGBA N32. Only the class representatives are built (one build per code-path
# class; `runtime_levels` limits the derived tiers), named with the suffix `-rgba`.
[[build]]
name = "x64-sse2-rgba"
level = "baseline"
runtime_levels = ["baseline", "ml3", "ml4"]
extra_cflags = ["/clang:-DSK_R32_SHIFT=0"]

[[build]]
name = "x64-sse41-rgba"
level = "ssse3"
single_tier = true
extra_cflags = ["/clang:-msse4.1", "/clang:-DSK_R32_SHIFT=0"]

[[build]]
name = "x64-scalar-rgba"
level = "baseline"
single_tier = true
extra_cflags = ["/clang:-DSKRP_CPU_SCALAR", "/clang:-DSK_R32_SHIFT=0"]

# GPU (Graphite + Dawn). Built on the sse2 baseline; each GPU tier pins a runtime CPU
# level because Graphite still does some work (software masks, uploads) on the CPU.
[[build]]
name = "gpu-dawn"
gpu = true
args = [
    "skia_enable_graphite=true",
    "skia_use_dawn=true",
    "skia_enable_ganesh=false",
    "dawn_enable_d3d12=true",
    "dawn_enable_vulkan=true",
]

# GPU tiers. `adapter` is matched against the Dawn adapter's device name/description
# (SKIA_ORACLE_DAWN_ADAPTER, added by the oracle patch); no match means no context.
# Vulkan/lavapipe needs a Linux build under WSL2 and isn't listed yet.

[[gpu_tier]]
name = "gpu-dawn-d3d12-warp"
build = "gpu-dawn"
configs = ["grdawn_d3d12"]
adapter = "Microsoft Basic Render Driver"
cpu_level = "ml3"

[[gpu_tier]]
name = "gpu-dawn-d3d12-rtx4070s"
build = "gpu-dawn"
configs = ["grdawn_d3d12"]
adapter = "RTX 4070 SUPER"
cpu_level = "ml3"
report_only = true

[[gpu_tier]]
name = "gpu-dawn-vk-rtx4070s"
build = "gpu-dawn"
configs = ["grdawn_vk"]
adapter = "RTX 4070 SUPER"
cpu_level = "ml3"
report_only = true

# Expected CPU behaviour classes (docs/design/raster-pipeline.md §4.4): tiers listed together
# must have identical hashes on every result, and two classes must differ. `cargo xtask oracle
# check-classes` enforces this against the goldens; a split or merge means the number of x64
# code paths skia-rust needs has changed.
[[class]]
name = "x64-1-sse2"
tiers = ["cpu-x64-sse2", "cpu-x64-sse2-rt-ssse3", "cpu-x64-ssse3"]

[[class]]
name = "x64-2-sse41"
tiers = ["cpu-x64-sse41", "cpu-x64-sse42", "cpu-x64-avx"]

[[class]]
name = "x64-3-ml3"
tiers = [
    "cpu-x64-sse2-rt-ml3", "cpu-x64-ssse3-rt-ml3", "cpu-x64-sse41-rt-ml3",
    "cpu-x64-sse42-rt-ml3", "cpu-x64-avx-rt-ml3", "cpu-x64-v3",
]

[[class]]
name = "x64-4-ml4"
tiers = [
    "cpu-x64-sse2-rt-ml4", "cpu-x64-ssse3-rt-ml4", "cpu-x64-sse41-rt-ml4",
    "cpu-x64-sse42-rt-ml4", "cpu-x64-avx-rt-ml4", "cpu-x64-v3-rt-ml4", "cpu-x64-v4",
]

# Not an x64 behaviour: the wasm stand-in must stay distinct from all four.
[[class]]
name = "scalar-proxy"
tiers = ["cpu-x64-scalar"]

# RGBA variants (SK_R32_SHIFT=0): the same behaviour classes, in RGBA byte order. They are
# separate classes because their bytes differ from the BGRA ones.
[[class]]
name = "x64-1-sse2-rgba"
tiers = ["cpu-x64-sse2-rgba"]

[[class]]
name = "x64-2-sse41-rgba"
tiers = ["cpu-x64-sse41-rgba"]

[[class]]
name = "x64-3-ml3-rgba"
tiers = ["cpu-x64-sse2-rgba-rt-ml3"]

[[class]]
name = "x64-4-ml4-rgba"
tiers = ["cpu-x64-sse2-rgba-rt-ml4"]

[[class]]
name = "scalar-proxy-rgba"
tiers = ["cpu-x64-scalar-rgba"]
