# Platform libm results differ in the last bits between hosts (UCRT, glibc, Apple, musl), and the
# goldens come from the oracle's UCRT. Ported code calls `skia_rust_core::libm` instead, which
# reproduces the UCRT bit for bit on every host (docs/design/math.md, docs/PORTING.md §5).
disallowed-methods = [
    { path = "f32::sin", reason = "use skia_rust_core::libm::sinf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::cos", reason = "use skia_rust_core::libm::cosf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::tan", reason = "use skia_rust_core::libm::tanf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::asin", reason = "use skia_rust_core::libm::asinf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::acos", reason = "use skia_rust_core::libm::acosf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::atan", reason = "use skia_rust_core::libm::atanf (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::atan2", reason = "use skia_rust_core::libm::atan2f (the oracle's UCRT, bit-exact on every host)" },
    { path = "f32::sin_cos", reason = "not UCRT-exact on every host: port the UCRT function into skia_rust_core::libm first (docs/design/math.md)" },
