url = "https://chromium.googlesource.com/external/github.com/harfbuzz/harfbuzz/+archive/9cb1fee51069b206effb4736e443b038d230789d/src.tar.gz"
tree_sha256 = "79bd51439106fdb021fe66dfc3a373ef32123dc75e31e46c0a928bd5bf767e7c"

