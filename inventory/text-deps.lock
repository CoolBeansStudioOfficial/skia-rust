# The C libraries the text modules' differential tools build (docs/design/modules.md §2.4, App. A),
# at Skia's DEPS pins (third_party/skia/DEPS#L55, #L57). `cargo xtask text-deps fetch` downloads
# them into the cache directory (oracle/text-deps) and checks the digests below.
#
# `tree_sha256` is the SHA-256 of the extracted tree's listing: one line `<sha256 of file>  <path>`
# per regular file, paths relative to the extraction root with `/` separators, sorted bytewise, each
# line ending in `\n`. (`find . -type f | sort` + `sha256sum`, then `sha256sum` of that listing.)

[harfbuzz]
