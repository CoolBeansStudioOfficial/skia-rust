[package]
name = "skia-rust-fuzz-targets"
description = "cargo-fuzz (libFuzzer) targets for the ported Skia fuzzers in skia-rust-fuzz (docs/design/fuzz.md)"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: it needs nightly (sanitizers) and libfuzzer-sys, which the stable workspace
# must never build. The root Cargo.toml excludes this directory.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
skia-rust-fuzz = { path = ".." }

[[bin]]
name = "CubicRoots"
path = "fuzz_targets/CubicRoots.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ImageFilter"
path = "fuzz_targets/ImageFilter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "NullCanvas"
path = "fuzz_targets/NullCanvas.rs"
test = false
doc = false
bench = false

