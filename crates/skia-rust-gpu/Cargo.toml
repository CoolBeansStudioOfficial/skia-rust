[package]
name = "skia-rust-gpu"
description = "GPU back ends of skia-rust: a port of Skia's src/gpu (shared code) and, later, Graphite on wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
skia-rust-core.workspace = true
skia-rust-effects.workspace = true
skia-rust-simd.workspace = true
skia-rust-sksl.workspace = true
bitflags.workspace = true

# wgpu backend (docs/design/gpu.md §4.1). Native targets get every backend wgpu enables by
# default plus the `noop` adapter (`Backends::NOOP`) that the headless context tests run on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "gles", "noop"] }

# wasm32 (Q6): wgpu's WebGPU backend, whose types are `!Send`; `Recording: Send` needs the
# non-atomic fragile marker (`wasm32-unknown-unknown` has no threads). Build-only in CI.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }

[lints]
workspace = true
